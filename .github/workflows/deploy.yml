name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *" # elke 3 uur: rooster opnieuw ophalen en publiceren

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Npm bijwerken
        run: npm install --global npm@11
      - run: npm ci
      - name: Rooster synchroniseren
        # Faalt de bron, dan blijft de bestaande echte snapshot staan (met oude updatedAt en
        # lastFailedAttempt) en verschijnt een waarschuwing. Zonder eerdere snapshot faalt de build.
        run: npm run sync:calendar
        env:
          TZ: Europe/Amsterdam
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

